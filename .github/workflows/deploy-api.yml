name: Deploy API (EC2 t3.small)

on:
  push:
    branches: [main, feat/api-spring-boot]
    paths:
      - "3.Servidor-API/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api-ec2
  cancel-in-progress: false

jobs:
  test-and-publish:
    name: Testar API e publicar imagem no GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Rodar testes da API
        working-directory: 3.Servidor-API
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew test --no-daemon

      - name: Normalizar nome da imagem para o GHCR
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=ghcr.io/${OWNER}/smartpark-api" >> "$GITHUB_OUTPUT"
          echo "image_tag=ghcr.io/${OWNER}/smartpark-api:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: 3.Servidor-API
          file: 3.Servidor-API/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-ec2:
    name: Atualizar stack na EC2 t3.small
    needs: test-and-publish
    runs-on: ubuntu-latest
    permissions:
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Enviar arquivos de infraestrutura para a EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "3.Servidor-API/docker-compose.yml,3.Servidor-API/docker-compose.aws.yml,3.Servidor-API/Caddyfile"
          strip_components: 1
          target: "/opt/smartpark"

      - name: Atualizar container na EC2 sem build local
        uses: appleboy/ssh-action@v1.2.0
        env:
          API_IMAGE: ${{ needs.test-and-publish.outputs.image_tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: API_IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            trap 'docker logout ghcr.io || true' EXIT
            cd /opt/smartpark
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f docker-compose.yml -f docker-compose.aws.yml --profile full pull api
            docker compose -f docker-compose.yml -f docker-compose.aws.yml --profile full up -d --no-build --wait --remove-orphans
            docker compose -f docker-compose.yml -f docker-compose.aws.yml --profile full exec -T caddy caddy reload --config /etc/caddy/Caddyfile || true
            docker image prune -f
