name: CI SmartPark (API + Android)

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  servidor-api:
    name: API Spring Boot (unitários + integração Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 3.Servidor-API
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Rodar testes da API (com Testcontainers)
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew test --no-daemon

      - name: Validar build da imagem Docker
        run: docker build -t smartpark-api:ci .

  app-android:
    name: App Android (unitários + APK debug)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 3.Implementacao
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Rodar testes unitários e gerar APK debug
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon
