spring:
  application:
    name: smartpark-api
  # Perfil padrao dev; em producao use SPRING_PROFILES_ACTIVE=prod
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/smartpark}
    username: ${DB_USER:smartpark}
    password: ${DB_PASSWORD:smartpark}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  mvc:
    async:
      request-timeout: -1

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${PORT:8080}

smartpark:
  jwt:
    # Em producao, defina JWT_SECRET (minimo 32 caracteres).
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    access-minutos: 60
    refresh-dias: 7
