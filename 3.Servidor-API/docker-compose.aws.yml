# Overlay para deploy em EC2 (t3.small) / VPS com imagem pré-construída no GHCR e HTTPS via Caddy.
# Uso na EC2 (sem build local):
#   docker compose -f docker-compose.yml -f docker-compose.aws.yml --profile full pull api
#   docker compose -f docker-compose.yml -f docker-compose.aws.yml --profile full up -d --no-build --wait

services:
  postgres:
    # Em produção na EC2, não expõe o PostgreSQL para a internet.
    ports: !reset []
    mem_limit: 384m

  api:
    # Imagem publicada pelo GitHub Actions; evita compilação local na t3.small.
    image: ${API_IMAGE:-ghcr.io/mix994/smartpark-api:latest}
    # A API fica acessível apenas pela rede interna do Docker; o Caddy expõe 80/443 com HTTPS.
    ports: !reset []
    mem_limit: 896m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: "${API_DOMAIN:?Defina API_DOMAIN no .env}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
